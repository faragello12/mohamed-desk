<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مكتب محمد</title>
<meta name="theme-color" content="#0D7A64">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@500;600;700&display=swap">
<style>
  /* Layout: a work day read top-down. Sticky header (date + "now"), a capture bar that is always there,
     then one view at a time: today's timeline, the week, clients, brain dump, schedule & settings. */
  :root {
    --bg: #F2F4F6; --surface: #FFFFFF; --sunk: #E9EDF1; --ink: #141920; --muted: #5A6472; --line: #DCE1E7;
    --accent: #0D7A64; --accent-ink: #FFFFFF; --accent-soft: #DCF0EA;
    --late: #C0410E; --late-soft: #FCE8DC; --warn: #9A5E06; --warn-soft: #FAEFD2; --done: #1B7F42;
    --c1: #0D7A64; --c2: #2D59CF; --c3: #B3461E; --c4: #8649BC; --c5: #A97700; --c6: #C93F75; --c7: #3D7A2C; --c8: #4B5563;
    --f-display: "Readex Pro", "IBM Plex Sans Arabic", Tahoma, sans-serif;
    --f-body: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
    --r: 10px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0E1115; --surface: #161A20; --sunk: #1D232B; --ink: #E8ECF1; --muted: #97A1AF; --line: #28303A;
      --accent: #3BC3A3; --accent-ink: #052019; --accent-soft: #12342C;
      --late: #F2895A; --late-soft: #3A1E12; --warn: #E7B44A; --warn-soft: #33280E; --done: #5CCF8A;
      --c1: #3BC3A3; --c2: #7F9EF5; --c3: #F08A5D; --c4: #C08CF0; --c5: #E7B44A; --c6: #F17BAA; --c7: #85C96E; --c8: #A3ADBB;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0E1115; --surface: #161A20; --sunk: #1D232B; --ink: #E8ECF1; --muted: #97A1AF; --line: #28303A;
    --accent: #3BC3A3; --accent-ink: #052019; --accent-soft: #12342C;
    --late: #F2895A; --late-soft: #3A1E12; --warn: #E7B44A; --warn-soft: #33280E; --done: #5CCF8A;
    --c1: #3BC3A3; --c2: #7F9EF5; --c3: #F08A5D; --c4: #C08CF0; --c5: #E7B44A; --c6: #F17BAA; --c7: #85C96E; --c8: #A3ADBB;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.6 var(--f-body); direction: rtl; padding-bottom: env(safe-area-inset-bottom, 0px); }
  img { max-width: 100%; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .wrap { max-width: 1040px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

  header.top { position: sticky; top: 0; z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top, 0px); }
  .top-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 12px 8px; flex-wrap: wrap; }
  .brand { font-size: 12px; color: var(--muted); letter-spacing: .02em; }
  .date { font-family: var(--f-display); font-size: 20px; font-weight: 600; margin: 0; text-wrap: balance; }
  .top-right { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .now { display: flex; align-items: center; gap: 8px; background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 4px 12px; font-size: 13px; font-weight: 600; min-width: 0; }
  .now .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none; }
  @media (prefers-reduced-motion: no-preference) { .now .dot { animation: pulse 2s ease-in-out infinite; } }
  @keyframes pulse { 50% { opacity: .35; } }
  .sync { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; white-space: nowrap; }
  .sync.ok { color: var(--done); }
  .sync.bad { color: var(--late); border-color: var(--late); }
  nav.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
  nav.tabs a { padding: 8px 12px; color: var(--muted); text-decoration: none; border-bottom: 2px solid transparent; white-space: nowrap; font-weight: 500; }
  nav.tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }
  nav.tabs .count { font-size: 12px; background: var(--sunk); border-radius: 999px; padding: 0 7px; margin-inline-start: 4px; color: var(--muted); }

  .capture { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-block: 16px 4px; }
  .capture .main { display: flex; gap: 8px; }
  .capture input[type=text] { flex: 1; min-width: 0; }
  .capture .opts { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .field, .capture input[type=text] { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; min-width: 0; }
  select.field { padding-inline-end: 6px; }
  .chk { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--muted); cursor: pointer; }
  .btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 14px; font-weight: 500; }
  .btn:hover { background: var(--sunk); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn.primary:hover { filter: brightness(1.05); }
  .btn.small { padding: 3px 10px; font-size: 13px; }
  .btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
  .btn.ghost:hover { background: var(--sunk); color: var(--ink); }
  .btn.danger { color: var(--late); }
  .btn:disabled { opacity: .6; cursor: default; }

  .note { margin-block: 12px; padding: 10px 14px; border-radius: var(--r); background: var(--warn-soft); color: var(--warn); font-size: 14px; }
  .auth { margin-block: 12px; padding: 12px 14px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--accent); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .auth b { flex: 1 1 100%; font-weight: 600; }
  .auth input { flex: 1 1 180px; }
  .auth .err { flex: 1 1 100%; color: var(--late); font-size: 13px; }
  main { padding-block: 8px 64px; }
  h2 { font-family: var(--f-display); font-size: 17px; font-weight: 600; margin: 0; }
  .sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-block: 22px 10px; flex-wrap: wrap; }
  .sec-head .sub { color: var(--muted); font-size: 13px; }
  .muted { color: var(--muted); }

  /* today */
  .summary { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-top: 14px; }
  .bar { flex: 1; min-width: 160px; height: 8px; background: var(--sunk); border-radius: 999px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--accent); border-radius: inherit; transition: width .3s; }
  .summary .nums { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .summary .nums b { color: var(--ink); font-weight: 600; }
  .today-grid { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 24px; align-items: start; }
  @media (max-width: 820px) { .today-grid { grid-template-columns: minmax(0, 1fr); } }
  .welcome { margin-top: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .welcome .row { display: flex; gap: 8px; flex-wrap: wrap; }

  .block { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 12px; padding-block: 12px; border-top: 1px solid var(--line); }
  .block:first-child { border-top: 0; }
  .block .time { font-variant-numeric: tabular-nums; font-size: 13px; color: var(--muted); padding-top: 2px; line-height: 1.4; }
  .block .time b { display: block; color: var(--ink); font-weight: 600; font-size: 14px; }
  .block .label { font-family: var(--f-display); font-weight: 600; font-size: 15px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .block .hint { color: var(--muted); font-size: 13px; margin-top: 1px; }
  .block.past .label, .block.past .time b { color: var(--muted); }
  .block.current { background: var(--accent-soft); border-radius: var(--r); padding-inline: 10px; border-top-color: transparent; }
  .block.current + .block { border-top-color: transparent; }
  .tag-now { font-family: var(--f-body); font-size: 11px; font-weight: 600; background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 1px 8px; }
  .items { display: flex; flex-direction: column; gap: 2px; margin-top: 6px; }
  .empty-block { font-size: 13px; color: var(--muted); margin-top: 4px; }

  .item { display: flex; align-items: flex-start; gap: 10px; padding: 6px 4px; border-radius: 8px; }
  .item:hover { background: var(--sunk); }
  .block.current .item:hover { background: var(--surface); }
  .tick { flex: none; width: 20px; height: 20px; margin-top: 2px; border-radius: 6px; border: 1.5px solid var(--muted); background: transparent; display: grid; place-items: center; padding: 0; }
  .tick.round { border-radius: 50%; }
  .tick svg { width: 12px; height: 12px; opacity: 0; }
  .item.done .tick { background: var(--done); border-color: var(--done); }
  .item.done .tick svg { opacity: 1; stroke: var(--surface); }
  .item .body { flex: 1; min-width: 0; }
  .item .title { overflow-wrap: anywhere; }
  .item .title.link { cursor: pointer; }
  .item.done .title { text-decoration: line-through; color: var(--muted); }
  .item .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
  .item .acts { display: flex; gap: 2px; flex: none; }
  .chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); }
  .chip .sw { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .pill { font-size: 11.5px; border-radius: 999px; padding: 0 8px; background: var(--sunk); color: var(--muted); line-height: 1.7; }
  .pill.late { background: var(--late-soft); color: var(--late); font-weight: 600; }
  .pill.warn { background: var(--warn-soft); color: var(--warn); font-weight: 600; }
  .pill.pri { background: var(--late-soft); color: var(--late); }
  .pill.ok { background: var(--accent-soft); color: var(--accent); }

  .side { display: flex; flex-direction: column; gap: 16px; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; }
  .panel h2 { font-size: 15px; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
  .panel .count { font-family: var(--f-body); font-size: 12px; background: var(--sunk); border-radius: 999px; padding: 0 8px; color: var(--muted); font-weight: 500; }
  .follow { padding-block: 8px; border-top: 1px solid var(--line); }
  .follow:first-of-type { border-top: 0; }
  .follow .name { display: flex; align-items: center; gap: 8px; font-weight: 600; }
  .follow .what { font-size: 13px; color: var(--muted); margin-top: 2px; overflow-wrap: anywhere; }
  .follow .row { display: flex; gap: 6px; align-items: center; justify-content: space-between; margin-top: 6px; flex-wrap: wrap; }

  /* week */
  .week { display: flex; flex-direction: column; gap: 10px; }
  .day { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 14px; }
  .day.is-today { border-color: var(--accent); }
  .day.off { background: transparent; border-style: dashed; }
  .day .dh { display: flex; align-items: baseline; gap: 10px; justify-content: space-between; flex-wrap: wrap; }
  .day .dh b { font-family: var(--f-display); font-weight: 600; }
  .day .routines { color: var(--muted); font-size: 13px; margin-top: 4px; overflow-wrap: anywhere; }

  /* clients */
  .clients { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 12px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .card .ch { display: flex; align-items: center; gap: 8px; }
  .card .ch .sw { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .card .ch b { font-family: var(--f-display); font-weight: 600; font-size: 16px; flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .card .services { display: flex; flex-wrap: wrap; gap: 4px; }
  .card .line { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
  .card .line b { color: var(--ink); font-weight: 500; }
  .card .tasks { display: flex; flex-direction: column; border-top: 1px solid var(--line); padding-top: 6px; }
  .card .foot { display: flex; gap: 6px; flex-wrap: wrap; margin-top: auto; padding-top: 4px; }
  .kind-head { margin-block: 22px 10px; }

  /* dump */
  textarea.dump { width: 100%; min-height: 160px; resize: vertical; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; line-height: 1.8; }
  .inbox-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 8px 4px; border-top: 1px solid var(--line); }
  .inbox-row .t { flex: 1 1 220px; min-width: 0; overflow-wrap: anywhere; }
  .inbox-row .ctl { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }

  /* plan & settings */
  .sched-row { display: grid; grid-template-columns: 96px 96px minmax(0, 1fr) minmax(0, 1.6fr) auto; gap: 6px; align-items: center; margin-bottom: 6px; }
  @media (max-width: 720px) { .sched-row { grid-template-columns: 1fr 1fr; } .sched-row .wide { grid-column: 1 / -1; } }
  .daychips { display: flex; gap: 4px; flex-wrap: wrap; }
  .daychip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 1px 10px; font-size: 13px; color: var(--muted); }
  .daychip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .routine { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 10px 0; border-top: 1px solid var(--line); }
  .routine .t { flex: 1 1 200px; min-width: 0; overflow-wrap: anywhere; }
  .settings { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
  .settings .panel { display: flex; flex-direction: column; gap: 8px; }
  .settings .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .settings p { margin: 0; font-size: 13px; color: var(--muted); }

  /* modal + toast */
  .overlay { position: fixed; inset: 0; background: rgb(0 0 0 / .45); display: grid; place-items: center; z-index: 20; padding: max(16px, env(safe-area-inset-left, 0px)); }
  .modal { background: var(--surface); border-radius: 14px; width: min(520px, 100%); max-height: 88vh; overflow: auto; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
  .modal h2 { margin-bottom: 4px; }
  .modal label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
  .modal label > .field, .modal label > textarea { color: var(--ink); font-size: 15px; width: 100%; }
  .modal textarea.field { min-height: 70px; resize: vertical; }
  .modal .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .modal .acts { display: flex; gap: 8px; justify-content: space-between; flex-wrap: wrap; margin-top: 6px; }
  .toast { position: fixed; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 16px; border-radius: 999px; font-size: 14px; z-index: 30; max-width: calc(100% - 32px); }
  .center-empty { text-align: center; color: var(--muted); padding: 32px 12px; }
</style>
<script src="config.js"></script>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="wrap">
      <div class="top-row">
        <div>
          <div class="brand" id="brand">مكتب محمد</div>
          <h1 class="date" id="date"></h1>
        </div>
        <div class="top-right">
          <div class="now" id="now" hidden><span class="dot"></span><span id="now-text"></span></div>
          <span class="sync" id="sync" hidden></span>
        </div>
      </div>
      <nav class="tabs" id="tabs" aria-label="الأقسام"></nav>
    </div>
  </header>

  <div class="wrap">
    <form class="auth" id="auth" hidden autocomplete="on">
      <b>سجّل دخول عشان المكتب يتزامن بين الموبايل واللابتوب</b>
      <input class="field" type="email" id="auth-email" placeholder="الإيميل" autocomplete="username" required>
      <input class="field" type="password" id="auth-pass" placeholder="الباسورد" autocomplete="current-password" required>
      <button class="btn primary" type="submit" id="auth-btn">دخول</button>
      <span class="err" id="auth-err" hidden></span>
    </form>
    <form class="capture" id="capture" autocomplete="off">
      <div class="main">
        <input type="text" id="qa-title" placeholder="إيه اللي لازم يتعمل؟ اكتبه هنا قبل ما تنساه" aria-label="مهمة جديدة">
      </div>
      <button class="btn primary" type="submit">زوّد</button>
      <div class="opts">
        <select class="field" id="qa-client" aria-label="العميل"></select>
        <select class="field" id="qa-when" aria-label="امتى">
          <option value="today">النهارده</option>
          <option value="tomorrow">بكرة</option>
          <option value="none">من غير ميعاد</option>
          <option value="date">يوم معيّن…</option>
        </select>
        <input class="field" type="date" id="qa-date" hidden aria-label="التاريخ">
        <select class="field" id="qa-block" aria-label="البلوك"></select>
        <label class="chk"><input type="checkbox" id="qa-pri"> مهم</label>
      </div>
    </form>
    <div class="note" id="note" hidden></div>
    <main id="view" aria-live="polite"></main>
  </div>
</div>
<div class="overlay" id="overlay" hidden></div>
<div class="toast" id="toast" hidden></div>
<input type="file" id="import-file" accept=".json,application/json" hidden>

<script>
(function () {
  'use strict';
  // ---------- constants & helpers ----------
  var DAYS = ['الأحد', 'الاتنين', 'التلات', 'الأربع', 'الخميس', 'الجمعة', 'السبت'];
  var WEEK_ORDER = [6, 0, 1, 2, 3, 4, 5];
  var KINDS = { retainer: 'شهري', project: 'مشروع', follow: 'متابعة' };
  var KIND_HEAD = { retainer: 'عملاء شهريين', project: 'مشاريع شغالة', follow: 'بتابع معاهم' };
  var COLORS = ['c1', 'c2', 'c3', 'c4', 'c5', 'c6', 'c7', 'c8'];
  var VIEWS = [
    { id: 'today', label: 'النهارده' },
    { id: 'week', label: 'الأسبوع' },
    { id: 'clients', label: 'العملاء' },
    { id: 'dump', label: 'فضّي دماغك' },
    { id: 'plan', label: 'الجدول والإعدادات' }
  ];
  var DEFAULT_SCHEDULE = {
    offDays: [5],
    blocks: [
      { id: 'b1', start: '10:00', end: '10:30', label: 'رسايل وترتيب اليوم', hint: 'رد على كل العملاء مرة واحدة، وبعدها اقفل الواتساب' },
      { id: 'b2', start: '10:30', end: '13:00', label: 'شغل عميق', hint: 'حاجة واحدة كبيرة بس، والموبايل بعيد' },
      { id: 'b3', start: '13:00', end: '14:00', label: 'بريك', hint: 'أكل وراحة، من غير شغل' },
      { id: 'b4', start: '14:00', end: '16:00', label: 'محتوى', hint: 'تصميم وكتابة البوستات' },
      { id: 'b5', start: '16:00', end: '17:00', label: 'إعلانات و Support', hint: 'شيك الإعلانات وطلبات العملاء' },
      { id: 'b6', start: '17:00', end: '18:00', label: 'متابعات وتعديلات', hint: 'ابعت المتابعات وخلّص التعديلات الصغيرة' },
      { id: 'b7', start: '21:00', end: '21:15', label: 'قفل اليوم', hint: 'علّم اللي خلص، وحط أهم 3 حاجات لبكرة' }
    ]
  };
  var CHECK_SVG = '<svg viewBox="0 0 12 12" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6.2l2.3 2.3 4.7-5"/></svg>';
  var STORE_KEY = 'mohamed-desk-v1';
  var SUPABASE_SRC = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js';

  // ---------- storage: this browser, plus optional Supabase sync ----------
  // Data shape: { collection: { id: doc } }. Every doc carries _t (last change, ms);
  // deletes leave { _deleted: true, _t } so other devices learn about them.
  var Store = (function () {
    var data = {}, subs = [];

    if (typeof data !== 'object' || Array.isArray(data)) data = {};
    function split(p) { var i = p.indexOf('/'); return [p.slice(0, i), p.slice(i + 1)]; }
    function saveLocal() {
      try { localStorage.setItem(STORE_KEY, JSON.stringify(data)); }
      catch (e) { note('المتصفح مش راضي يحفظ. لو فاتح الصفحة في وضع التصفح الخفي افتحها عادي.'); }
    }
    function emit() { subs.slice().forEach(function (f) { f(); }); }
    return {
      get: function (p) { var s = split(p), d = data[s[0]] && data[s[0]][s[1]]; return d && !d._deleted ? d : null; },
      list: function (c) {

      put: function (p, doc) { var s = split(p); (data[s[0]] = data[s[0]] || {})[s[1]] = doc; saveLocal(); emit(); Sync.dirty(); },

          var mc = data[c] = data[c] || {};

            if (stampMissing && !o._t) o = Object.assign({}, o, { _t: now });

  var Sync = (function () {

    function set(s, err) { state = s; lastErr = err || ''; renderSync(); }

        s.onload = function () { res(); }; s.onerror = function () { rej(new Error('مكتبة Supabase مااتحملتش. شيك على النت')); };
        document.head.append(s);

      var r = await sb.from('desk_state').select('data').eq('user_id', user.id).maybeSingle();
      if (r.error) throw r.error;
      return r.data ? r.data.data : null;
    }
    async function pull() {
      if (!sb || !user) return;
      try { var remote = await fetchRemote(); if (remote) Store.mergeIn(remote); if (state !== 'saving') set('synced'); }
      catch (e) { set('error', e.message); }

    async function push() {

      try {
        var remote = await fetchRemote();
        if (remote) Store.mergeIn(remote);
        Store.prune();
        var r = await sb.from('desk_state').upsert({ user_id: user.id, data: Store.raw(), updated_at: new Date().toISOString() });
        if (r.error) throw r.error;

    return {
      enabled: enabled,
      state: function () { return state; },
      error: function () { return lastErr; },
      email: function () { return user && user.email; },

    blocks().forEach(function (b) { bs.append(h('option', { value: b.id }, b.start + ' ' + b.label)); });
    bs.value = draft.block;
    var ti = h('input', { class: 'field', type: 'text', value: draft.title, 'aria-label': 'الروتين', style: 'flex:1 1 220px', onchange: function () { draft.title = this.value.trim() || draft.title; persist(); } });
    var confirmDel = false;
    return h('div', { class: 'routine' }, ti, cs, bs, chips,
      h('button', { class: 'btn ghost small danger', type: 'button', onclick: function () {
        if (!confirmDel) { confirmDel = true; this.textContent = 'متأكد؟'; return; }
        save('routines/' + r.id, function (ref) { return ref.delete(); });
      } }, 'امسح'));
  }

  // ---------- modals ----------
  function openModal(node) {
    var o = $('overlay'); o.replaceChildren(node); o.hidden = false;
    var f = node.querySelector('input,textarea,select'); if (f) f.focus();
  }
  function closeModal() { var o = $('overlay'); o.hidden = true; o.replaceChildren(); if (pending) { pending = false; render(); } }
  $('overlay').addEventListener('click', function (e) { if (e.target === this) closeModal(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('overlay').hidden) closeModal(); });

  function editTask(t, isNew) {
    var title = h('input', { class: 'field', type: 'text', value: t.title || '', id: 'm-title' });
    var cs = h('select', { class: 'field', id: 'm-client' }, h('option', { value: '' }, 'من غير عميل'));
    activeClients().forEach(function (c) { cs.append(h('option', { value: c.id }, c.name)); }); cs.value = t.client || '';
    var due = h('input', { class: 'field', type: 'date', value: t.due || '', id: 'm-due' });
    var bs = h('select', { class: 'field', id: 'm-block' }, h('option', { value: '' }, 'أي وقت'));
    blocks().forEach(function (b) { bs.append(h('option', { value: b.id }, b.start + ' ' + b.label)); }); bs.value = t.block || '';
    var pri = h('input', { type: 'checkbox', id: 'm-pri', checked: !!t.pri });
    var confirmDel = false;
    var del = isNew ? null : h('button', { class: 'btn ghost danger', type: 'button', onclick: function () {
      if (!confirmDel) { confirmDel = true; this.textContent = 'متأكد؟ دوس تاني'; return; }
      deleteTask(t); closeModal(); toast('اتمسحت');
    } }, 'امسح المهمة');
    var form = h('form', { class: 'modal', onsubmit: function (e) {
      e.preventDefault();
      var v = { title: title.value.trim(), client: cs.value, due: due.value, block: bs.value, pri: pri.checked };
      if (!v.title) { title.focus(); return; }
      if (isNew) { addTask(v); toast('اتضافت'); } else patchTask(t, v);
      closeModal();
    } },
      h('h2', null, isNew ? 'مهمة جديدة' : 'تعديل المهمة'),
      h('label', null, 'المهمة', title),
      h('div', { class: 'two' }, h('label', null, 'العميل', cs), h('label', null, 'اليوم (فاضي = الصندوق)', due)),
      h('label', null, 'البلوك', bs),
      h('label', { class: 'chk', style: 'flex-direction:row' }, pri, 'مهم'),
      h('div', { class: 'acts' }, h('div', { style: 'display:flex;gap:8px' },
        h('button', { class: 'btn primary', type: 'submit' }, 'احفظ'),
        h('button', { class: 'btn', type: 'button', onclick: closeModal }, 'إلغاء')), del));
    openModal(form);
  }

  function editClient(c) {
    var isNew = !c;
    c = c || { name: '', kind: 'project', services: [], keys: [], followEvery: 0, lastContact: '', nextAction: '', notes: '', color: COLORS[S.clients.length % COLORS.length] };
    var name = h('input', { class: 'field', type: 'text', value: c.name, id: 'c-name' });
    var kind = h('select', { class: 'field', id: 'c-kind' });
    Object.keys(KINDS).forEach(function (k) { kind.append(h('option', { value: k }, KINDS[k])); }); kind.value = c.kind || 'project';
    var services = h('input', { class: 'field', type: 'text', value: (c.services || []).join('، '), id: 'c-services', placeholder: 'سوشيال ميديا، إعلانات، Shopify' });
    var keys = h('input', { class: 'field', type: 'text', value: (c.keys || []).join('، '), id: 'c-keys', placeholder: 'الأسامي اللي بتكتبه بيها' });
    var every = h('input', { class: 'field', type: 'number', min: '0', max: '90', value: String(c.followEvery || 0), id: 'c-every' });
    var last = h('input', { class: 'field', type: 'date', value: c.lastContact || '', id: 'c-last' });
    var next = h('input', { class: 'field', type: 'text', value: c.nextAction || '', id: 'c-next', placeholder: 'هتكلمهم في إيه المرة الجاية' });
    var notes = h('textarea', { class: 'field', id: 'c-notes' }); notes.value = c.notes || '';
    var order = h('input', { class: 'field', type: 'number', min: '1', max: '999', value: String(c.order || S.clients.length + 1), id: 'c-order' });
    var color = h('select', { class: 'field', id: 'c-color' });
    COLORS.forEach(function (k, i) { color.append(h('option', { value: k }, 'لون ' + (i + 1))); }); color.value = c.color || 'c8';
    var split = function (s) { return s.split(/[،,]/).map(function (x) { return x.trim(); }).filter(Boolean); };
    var confirmArc = false;
    var arc = isNew ? null : h('button', { class: 'btn ghost danger', type: 'button', onclick: function () {
      if (!confirmArc) { confirmArc = true; this.textContent = 'متأكد؟ دوس تاني'; return; }
      save('clients/' + c.id, function (r) { return r.update({ archived: true }); }); closeModal(); toast(c.name + ' اتقفل، تقدر ترجّعه من تحت صفحة العملاء');
    } }, 'قفّل العميل');
    var form = h('form', { class: 'modal', onsubmit: function (e) {
      e.preventDefault();
      var v = { name: name.value.trim(), kind: kind.value, services: split(services.value), keys: split(keys.value),
        followEvery: Math.max(0, Number(every.value) || 0), lastContact: last.value, nextAction: next.value.trim(), notes: notes.value.trim(),
        color: color.value, order: Number(order.value) || S.clients.length + 1, archived: false };
      if (!v.name) { name.focus(); return; }
      var id = c.id || uid('c');
      save('clients/' + id, function (r) { return r.set(v); }).then(function (ok) { if (ok) toast('اتحفظ'); });
      closeModal();
    } },
      h('h2', null, isNew ? 'عميل جديد' : 'تعديل ' + c.name),
      h('div', { class: 'two' }, h('label', null, 'الاسم', name), h('label', null, 'النوع', kind)),
      h('label', null, 'الخدمات (افصل بفاصلة)', services),
      h('div', { class: 'two' }, h('label', null, 'تابع كل كام يوم (0 = لأ)', every), h('label', null, 'آخر تواصل', last)),
      h('label', null, 'الخطوة الجاية', next),
      h('label', null, 'ملاحظات', notes),
      h('label', null, 'كلمات تتعرّف بيها في المهام (افصل بفاصلة)', keys),
      h('div', { class: 'two' }, h('label', null, 'اللون', color), h('label', null, 'الترتيب', order)),
      h('div', { class: 'acts' }, h('div', { style: 'display:flex;gap:8px' },
        h('button', { class: 'btn primary', type: 'submit' }, 'احفظ'),
        h('button', { class: 'btn', type: 'button', onclick: closeModal }, 'إلغاء')), arc));
    openModal(form);
  }

  // ---------- render loop ----------
  function view() {
    var v = (location.hash || '').replace('#', '');
    return VIEWS.some(function (x) { return x.id === v; }) ? v : 'today';
  }
  var pending = false, raf = 0;
  function changed() { if (raf) return; raf = requestAnimationFrame(function () { raf = 0; render(); }); }
  function render() {
    renderHeader();
    var root = $('view');
    var a = document.activeElement;
    if ((a && root.contains(a) && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) || !$('overlay').hidden) { pending = true; return; }
    pending = false;
    var y = window.scrollY;
    root.replaceChildren();
    var v = view();
    $('capture').hidden = v === 'plan';
    if (v === 'today') viewToday(root);
    else if (v === 'week') viewWeek(root);
    else if (v === 'clients') viewClients(root);
    else if (v === 'dump') viewDump(root);
    else viewPlan(root);
    window.scrollTo(0, y);
  }
  $('view').addEventListener('focusout', function () { setTimeout(function () { if (pending) render(); }, 0); });
  window.addEventListener('hashchange', function () { pending = false; planDraft = null; window.scrollTo(0, 0); var a = document.activeElement; if (a && a.blur) a.blur(); render(); });
  // another tab of the desk changed the data: take its newer docs (no reload, so two tabs can't ping-pong)
  window.addEventListener('storage', function (e) {
    if (e.key !== STORE_KEY || !e.newValue) return;
    try { Store.mergeIn(JSON.parse(e.newValue)); } catch (x) { /* ignore a half-written value */ }
  });
  setInterval(function () {
    var t = ymd(new Date());
    if (t !== TODAY) { TODAY = t; subDay(); }
    if (view() === 'plan') renderHeader(); else changed();
  }, 60000);

  fillSelects();
  start();
  render();
})();
</script>
</body>
</html>
